<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Subathon Timer — overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Drop #009 — Subathon Timer overlay (OBS browser source).
   Transparent; everything renders from the Supabase row that the
   dashboard edits — settings changes appear live, same URL forever.
   ============================================================ */
:root{
  --accent:#3fe08b;
  --scale:1;
  --fd:'Space Grotesk',system-ui,sans-serif;
  --fm:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;
  font-family:var(--fd);-webkit-font-smoothing:antialiased}

.wrap{position:relative;text-align:center;transform:scale(var(--scale));transform-origin:center;
  opacity:0;transition:opacity .5s ease}
.wrap.show{opacity:1}

/* label pill */
.label{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-weight:600;
  font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:#fff;
  padding:7px 16px 7px 20px;border-radius:999px;margin-bottom:10px;
  background:rgba(8,10,9,.72);border:1px solid rgba(255,255,255,.14);
  text-shadow:0 1px 6px rgba(0,0,0,.8)}
.label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 10px var(--accent);animation:blink 2.2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* the clock */
.clock{font-family:var(--fm);font-weight:700;font-size:96px;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 44px rgba(0,0,0,.6)}
.clock .unit{opacity:.55;font-size:.36em;font-weight:600;letter-spacing:.06em;margin:0 6px 0 2px}
.clock.bump{animation:bump .5s cubic-bezier(.16,1,.3,1)}
@keyframes bump{0%{transform:scale(1)}30%{transform:scale(1.05);filter:brightness(1.35)}100%{transform:scale(1)}}

/* state badges */
.badge{display:none;margin-top:12px;font-family:var(--fm);font-weight:600;font-size:13px;
  letter-spacing:.28em;text-transform:uppercase;color:#0a0a0b;background:#ffd35c;
  padding:6px 16px;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
body.paused .badge.b-paused{display:inline-block}
body.ended .badge.b-ended{display:inline-block;background:var(--accent)}
body.idle .badge.b-idle{display:inline-block;background:rgba(255,255,255,.16);color:#fff}
body.paused .clock{opacity:.55}
body.idle .clock{opacity:.35}
body.ended .clock{text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 60px var(--accent)}
body.ended .label .dot{animation:none;background:var(--accent)}

/* +time toasts */
.toasts{position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:14px;
  display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-weight:600;font-size:16px;
  color:#fff;background:rgba(8,10,9,.8);border:1px solid rgba(255,255,255,.14);border-radius:12px;
  padding:8px 16px;white-space:nowrap;opacity:0;transform:translateY(-8px) scale(.94);
  transition:opacity .35s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.toast.in{opacity:1;transform:none}
.toast.out{opacity:0;transform:translateY(6px) scale(.96)}
.toast .plus{color:var(--accent);text-shadow:0 0 14px var(--accent)}
.toast .who{opacity:.75;font-weight:500;font-size:14px;max-width:260px;overflow:hidden;text-overflow:ellipsis}

/* ---- theme: minimal (plain, no pill/panel chrome) ---- */
body.t-minimal .label{background:transparent;border-color:transparent;padding:0 4px;margin-bottom:6px}
body.t-minimal .label .dot{display:none}
body.t-minimal .toast{background:rgba(0,0,0,.55);border-color:transparent}

/* ---- theme: neon (accent digits, heavy glow) ---- */
body.t-neon .clock{color:var(--accent);
  text-shadow:0 0 12px var(--accent),0 0 46px var(--accent),0 2px 10px rgba(0,0,0,.8)}
body.t-neon .label{border-color:var(--accent);color:var(--accent);background:rgba(8,10,9,.6)}
body.t-neon .toast{border-color:var(--accent)}

@media (prefers-reduced-motion:reduce){ *{transition:none !important;animation:none !important} }

/* status line (connection problems only — invisible when fine) */
.status{position:fixed;left:10px;bottom:8px;font-family:var(--fm);font-size:11px;color:rgba(255,255,255,.55);
  background:rgba(0,0,0,.5);padding:3px 8px;border-radius:6px;display:none}
.status.show{display:block}
</style>
</head>
<body>
  <div class="wrap" id="wrap">
    <div class="label" id="label"><span class="dot"></span><span id="labelText">SUBATHON</span></div>
    <div class="clock" id="clock">--<span class="unit">:</span>--<span class="unit">:</span>--</div>
    <div>
      <span class="badge b-idle">waiting to start</span>
      <span class="badge b-paused">paused</span>
      <span class="badge b-ended">complete</span>
    </div>
    <div class="toasts" id="toasts"></div>
  </div>
  <div class="status" id="status"></div>

<script>
/* Same shared Supabase project as the other overlays — publishable read-only key;
   writes are impossible from here (RLS: select-only for anon). */
const SB_URL = "https://taodbtlgpvaabvcnsekg.supabase.co";
const SB_KEY = "sb_publishable_imq8qxgP3woB_umzNjMDSw_4CpBrgvp";

const P = new URLSearchParams(location.search);
const ID = P.get('id') || '';
const DEMO = P.get('demo') === '1';

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');

let ROW = null;              // the timer row (settings + ends_at + paused_at)
let lastEventAt = 0;         // last toast we showed
let lastRemainingSec = null; // for the "bump" when time jumps up

function setStatus(msg){ const s = $('status'); s.textContent = msg || ''; s.classList.toggle('show', !!msg); }

/* ---------- settings → look ---------- */
const DEFAULT_STYLE = { theme:'tez', accent:'#3fe08b', label:'SUBATHON', show_label:true, show_toasts:true, size:100 };
function styleOf(row){
  const s = (row && row.settings && row.settings.style) || {};
  return { ...DEFAULT_STYLE, ...s };
}
function applyLook(row){
  const st = styleOf(row);
  document.body.classList.remove('t-tez','t-minimal','t-neon');
  document.body.classList.add('t-' + (['tez','minimal','neon'].includes(st.theme) ? st.theme : 'tez'));
  document.documentElement.style.setProperty('--accent', /^#[0-9a-fA-F]{6}$/.test(st.accent) ? st.accent : '#3fe08b');
  document.documentElement.style.setProperty('--scale', (Math.min(200, Math.max(50, +st.size || 100)) / 100));
  $('labelText').textContent = st.label || 'SUBATHON';
  $('label').style.display = st.show_label === false ? 'none' : '';
}

/* ---------- ticking ---------- */
function remainingMs(row){
  if (!row || !row.ends_at) return null;                       // idle
  const base = row.paused_at ? Date.parse(row.paused_at) : Date.now();
  return Date.parse(row.ends_at) - base;
}
function render(){
  const rem = remainingMs(ROW);
  document.body.classList.toggle('idle', rem === null);
  document.body.classList.toggle('paused', rem !== null && !!ROW.paused_at && rem > 0);
  document.body.classList.toggle('ended', rem !== null && rem <= 0);
  const c = $('clock');
  if (rem === null){ c.innerHTML = '--<span class="unit">:</span>--<span class="unit">:</span>--'; lastRemainingSec = null; return; }
  const s = Math.max(0, Math.floor(rem / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
  c.innerHTML = h + '<span class="unit">:</span>' + pad(m) + '<span class="unit">:</span>' + pad(ss);
  // time jumped up (a sub landed / manual add) → bump
  if (lastRemainingSec !== null && s > lastRemainingSec + 2){
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
  lastRemainingSec = s;
}
setInterval(render, 250);

/* ---------- toasts ---------- */
function fmtSecs(sec){
  if (sec >= 3600) return Math.round(sec / 360) / 10 + 'h';
  if (sec >= 60){ const m = Math.floor(sec / 60), r = sec % 60; return r ? m + 'm ' + r + 's' : m + 'm'; }
  return sec + 's';
}
function toast(ev){
  const st = styleOf(ROW);
  if (st.show_toasts === false) return;
  const t = document.createElement('div');
  t.className = 'toast';
  const who = ev.name ? (ev.kind === 'gift' && ev.count > 1 ? ev.name + ' gifted ' + ev.count : ev.name) : 'sub';
  t.innerHTML = '<span class="plus">+' + fmtSecs(ev.secs | 0) + '</span><span class="who"></span>';
  t.querySelector('.who').textContent = who;
  const box = $('toasts');
  box.appendChild(t);
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.add('in')));
  setTimeout(() => t.classList.add('out'), 4600);
  setTimeout(() => t.remove(), 5300);
  while (box.children.length > 3) box.firstChild.remove();
}
function maybeToast(row){
  const ev = row && row.last_event;
  if (!ev || !ev.at) return;
  const at = Date.parse(ev.at);
  if (!at || at <= lastEventAt) return;
  const fresh = Date.now() - at < 20000;   // only toast recent events (not on first load)
  lastEventAt = at;
  if (fresh && lastRemainingSec !== null) toast(ev);
}

/* ---------- data: realtime + safety poll ---------- */
function apply(row){
  if (!row) return;
  ROW = row;
  applyLook(row);
  maybeToast(row);
  render();
  $('wrap').classList.add('show');
}
function loadSupabase(cb){
  if (window.supabase){ cb(); return; }
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = cb;
  s.onerror = () => setStatus('could not load realtime');
  document.head.appendChild(s);
}
function start(){
  if (!ID){ setStatus('Missing link — get your overlay URL at tezcreations.com/drops/009'); return; }
  loadSupabase(() => {
    const sb = supabase.createClient(SB_URL, SB_KEY);
    const fetchRow = () => sb.from('subathon_timers').select('*').eq('id', ID).maybeSingle()
      .then(({ data, error }) => {
        if (error){ setStatus('connection error'); return; }
        if (!data){ setStatus('Unknown timer — check your overlay URL'); return; }
        setStatus('');
        // first load: remember the current event so we don't replay an old toast
        if (!ROW && data.last_event && data.last_event.at) lastEventAt = Date.parse(data.last_event.at) || 0;
        apply(data);
      });
    fetchRow();
    sb.channel('subathon-' + ID).on('postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'subathon_timers', filter: 'id=eq.' + ID },
      p => { if (p.new) apply(p.new); }).subscribe();
    setInterval(fetchRow, 60000);   // safety net if realtime hiccups
  });
}

/* ---------- demo mode (no backend; for testing + previews) ---------- */
function startDemo(){
  const style = { ...DEFAULT_STYLE };
  if (P.get('theme')) style.theme = P.get('theme');
  if (P.get('accent')) style.accent = '#' + String(P.get('accent')).replace('#','');
  if (P.get('label')) style.label = P.get('label');
  if (P.get('size')) style.size = +P.get('size');
  ROW = {
    settings: { sec_per_sub: 60, style },
    ends_at: new Date(Date.now() + 2 * 3600000).toISOString(),
    paused_at: null, last_event: null,
  };
  // &state=paused|ended|idle → preview those states (no fake subs)
  const st8 = P.get('state');
  if (st8 === 'paused') ROW.paused_at = new Date().toISOString();
  else if (st8 === 'ended') ROW.ends_at = new Date(Date.now() - 1000).toISOString();
  else if (st8 === 'idle') ROW.ends_at = null;
  if (st8){ apply(ROW); return; }
  apply(ROW);
  const names = ['pixel_pete','night0wl','gg_martha','subzero_sam','luna_livestream','choppedcheese','drift_king'];
  setInterval(() => {
    const gift = Math.random() < .25;
    const count = gift ? (1 + Math.floor(Math.random() * 5)) : 1;
    const secs = 60 * count;
    ROW.ends_at = new Date(Date.parse(ROW.ends_at) + secs * 1000).toISOString();
    ROW.last_event = { kind: gift ? 'gift' : 'sub', name: names[Math.floor(Math.random() * names.length)],
      count, secs, at: new Date().toISOString() };
    apply(ROW);
  }, 6500);
}

if (DEMO) startDemo(); else start();
</script>
</body>
</html>
